<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a120c">
<title>山寺小院</title>
<meta name="description" content="敲木鱼、上香、拜佛、诵经，收留山门外的流浪小动物。">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #1a120c;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  textarea { -webkit-user-select: text; user-select: text; touch-action: auto; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" role="img" aria-label="山寺小院：庭院与大雄宝殿。空格或回车敲木鱼，M 静音，Esc 关闭，H 查看快捷键。"></canvas>
<div id="sr" class="sr-only" aria-live="polite"></div>
<script src="ad-kit.js?v=4"></script>
<script src="game.js?v=4"></script>
</body>
</html>
